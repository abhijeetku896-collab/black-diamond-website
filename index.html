<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ã blãçk diãmõnd</title><style>body{margin:0;background:#070707;color:#eee;font:15px Arial;padding:8vw}h1,h2{font-family:Georgia,serif}a,button{color:#111;background:#eee;padding:12px 18px;text-decoration:none;border:0;cursor:pointer}.muted{color:#888}.section{padding:70px 0;border-top:1px solid #222}.admin{position:fixed;right:20px;top:20px}.modal{position:fixed;inset:0;background:#000e;display:none;padding:5vw;overflow:auto}.box{max-width:700px;margin:auto;background:#111;padding:25px}.box input,.box textarea{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;background:#181818;color:#fff;border:1px solid #333}.row{display:flex;gap:10px;align-items:center}.item{border:1px solid #292929;padding:15px;margin:10px 0}</style></head><body><button class="admin" onclick="openAdmin()">Admin Login</button><h1 id="name">Ã blãçk diãmõnd</h1><p id="tagline" class="muted"></p><div id="site"></div><div id="modal" class="modal"><div class="box"><div id="login"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="panel" style="display:none"><div class="row"><h2 style="flex:1">Admin Panel</h2><button onclick="closeAdmin()">×</button></div><div id="items"></div><button onclick="add()">+ Add Section</button><h3>Settings</h3><input id="sn"><input id="st"><input id="se"><button onclick="settings()">Save Settings</button></div></div></div><script>
async function api(u,o){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});if(!r.ok)throw Error((await r.json()).error||"Error");return r.json()}
async function load(){let d=await api("/api/site");name.textContent=d.settings.name;tagline.textContent=d.settings.tagline;sn.value=d.settings.name;st.value=d.settings.tagline;se.value=d.settings.email;site.innerHTML=d.sections.filter(x=>x.visible).map(x=>`<section class="section"><h2>${x.title}</h2><p class="muted">${x.text}</p></section>`).join("");items.innerHTML=d.sections.map(x=>`<div class=item><b>${x.type}</b><input id=t${x.id} value="${x.title}"><textarea id=x${x.id}>${x.text}</textarea><label><input id=v${x.id} type=checkbox ${x.visible?"checked":""}> Show</label><button onclick="upd(${x.id})">Update</button> <button onclick="del(${x.id})">Delete</button></div>`).join("")}
function openAdmin(){modal.style.display="block"}function closeAdmin(){modal.style.display="none"}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});loginDiv();await load()}catch(e){alert(e.message)}}
function loginDiv(){login.style.display="none";panel.style.display="block"}
async function upd(id){await api("/api/sections/"+id,{method:"PUT",body:JSON.stringify({type:"text",title:document.getElementById("t"+id).value,text:document.getElementById("x"+id).value,visible:document.getElementById("v"+id).checked})});load()}
async function del(id){if(confirm("Delete?")){await api("/api/sections/"+id,{method:"DELETE"});load()}}
async function add(){let type=prompt("Type");if(!type)return;await api("/api/sections",{method:"POST",body:JSON.stringify({type,title:type,text:"Add your content here.",visible:true})});load()}
async function settings(){await api("/api/settings",{method:"PUT",body:JSON.stringify({name:sn.value,tagline:st.value,email:se.value})});load()}
load().catch(()=>{});
</script></body></html>
